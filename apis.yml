aid: coachhub
name: coachhub
description: >-
  CoachHub is a global digital coaching platform (headquartered in Berlin)
  that lets enterprises deliver scalable, measurable one-to-one coaching to
  their entire workforce through web and mobile apps. Its network spans 3,500+
  certified business coaches across 90+ countries with sessions in 80+
  languages, matched to learners via AI, and it ships an AI coaching companion
  (AIMY). CoachHub serves 1,000+ enterprise clients and is backed by SoftBank
  Vision Fund 2, Sofina, HV Capital, Partech and Speedinvest. It offers an
  account-managed integration approach (SSO, automated provisioning and data
  sync) with HR/LMS systems such as Workday, SAP, Oracle, Ceridian and
  Microsoft Teams, but publishes no public developer API, OpenAPI, SDKs or
  GitHub repositories. The platform is ISO 27001, ISO 27701, SOC 2 Type II,
  TISAX and PCI DSS Level 1 certified and GDPR/CCPA compliant.
